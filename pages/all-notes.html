<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../utility/ctrl-guard.js"></script>
    <script src="../javascript/block-guard.js"></script>
    <script src="../javascript/auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - TexaNotes</title>
    <link rel="stylesheet" href="../stylesheets/all-notes.css">
    <script src="../utility/pwa-register.js"></script>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo" title="TexaNotes">TexaNotes</div>
        
        <ul class="nav-links">
            <li><a href="#" id="nav-all" class="active">All Notes</a></li>
            <li><a href="#" id="nav-theory">Theory Notes</a></li>
            <li><a href="#" id="nav-practical">Practical Notes</a></li>
            <li><a href="../index.html" class="btn-home">Home</a></li>
        </ul>

        <!-- Hamburger Icon for Mobile -->
        <div class="hamburger">
            <div class="line1"></div>
            <div class="line2"></div>
            <div class="line3"></div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="view-container">
        <header class="page-header">
            <h1 id="category-title">All Notes</h1>
            <p>Browse and download study materials instantly.</p>
        </header>

        <!-- Search & Sort Controls -->
        <div class="controls-section">
            <div class="search-wrapper">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <input type="text" id="search-input" placeholder="Search notes, teachers, or subjects...">
            </div>
            
            <div class="sort-box">
                <svg class="sort-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12" />
                </svg>
                <select id="sort-select">
                    <option value="date-desc">Newest First</option>
                    <option value="date-asc">Oldest First</option>
                    <option value="name-asc">Name (A-Z)</option>
                    <option value="name-desc">Name (Z-A)</option>
                    <option value="subject-asc">Subject (A-Z)</option>
                    <option value="teacher-asc">Teacher (A-Z)</option>
                </select>
            </div>
        </div>

        <!-- Notes Display Grid -->
        <div id="notes-grid" class="notes-grid">
            <!-- Loading state -->
            <div class="loading-state">
                <div class="spinner"></div>
                <p>Fetching notes...</p>
            </div>
        </div>
    </main>

    <script src="../utility/essentials.js"></script>
    <script src="../javascript/all-notes.js"></script>
</body>
</html>
