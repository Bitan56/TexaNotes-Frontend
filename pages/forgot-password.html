<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../utility/ctrl-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - TexaNotes</title>
    <link rel="stylesheet" href="../stylesheets/forgot-password.css">
    <script src="../utility/pwa-register.js"></script>
</head>
<body>

    <div class="auth-container">
        <!-- STEP 1: Enter Email -->
        <div id="step-email" class="step active">
            <h2>Forgot Password</h2>
            <p>Enter your registered email address to receive a verification OTP.</p>
            <form id="email-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="example@email.com">
                </div>
                <button type="submit" class="btn-submit" id="btn-email">Send OTP</button>
            </form>
            <a href="login.html" class="back-to-login">← Back to Login</a>
        </div>

        <!-- STEP 2: Enter OTP -->
        <div id="step-otp" class="step">
            <h2>Verify OTP</h2>
            <p>We've sent a 4-digit code to your email. Please enter it below.</p>
            <form id="otp-form">
                <div class="form-group">
                    <label for="otp">Enter OTP</label>
                    <input type="text" id="otp" required placeholder="e.g. 1234" maxlength="4" pattern="\d{4}">
                </div>
                <button type="submit" class="btn-submit" id="btn-otp">Verify OTP</button>
            </form>
            <a href="javascript:location.reload()" class="back-to-login">← Start Over</a>
        </div>

        <!-- STEP 3: Reset Password -->
        <div id="step-password" class="step">
            <h2>Set New Password</h2>
            <p>Your OTP was verified! Create a new password below.</p>
            <form id="password-form">
                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <input type="password" id="new-password" required placeholder="Enter new password">
                </div>
                <button type="submit" class="btn-submit" id="btn-password">Reset Password</button>
            </form>
        </div>
    </div>

    <script src="../javascript/forgot-password.js"></script>
</body>
</html>
