<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../utility/ctrl-guard.js"></script>
    <script src="../javascript/logIn-block.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - TexaNotes</title>
    <link rel="stylesheet" href="../stylesheets/signup.css">
    <script src="../utility/pwa-register.js"></script>
</head>
<body>
    <a href="../index.html" class="home-btn">← Back to Home</a>
    
    <div class="signup-container">
        <div class="signup-card">
            <h2>Join TexaNotes</h2>
            <p>Create an account to start organizing your thoughts.</p>
            
            <form id="signup-form">
                <div class="input-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter Your Name" required>
                </div>
                
                <div class="input-group">
                    <label for="userName">Username</label>
                    <input type="text" id="userName" name="userName" placeholder="Choose a username" required>
                </div>
                
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Choose a strong password" required>
                </div>
                
                <button type="submit" class="btn-submit">Sign Up</button>
            </form>
            
            <p class="login-redirect">
                Already have an account? <a href="logIn.html">Log in here</a>
            </p>
        </div>
    </div>

    <!-- NEW: Success Modal Overlay -->
    <div class="modal-overlay" id="success-modal" style="display: none;">
        <div class="modal-box">
            <div class="success-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12zm11.378-3.917c-.89-.777-2.366-1.356-3.628-1.356-1.674 0-2.899.8-2.899 2.144 0 1.25.968 1.83 2.492 2.302 1.34.412 2.404.912 2.404 2.115 0 1.403-1.464 2.164-3.18 2.164-1.328 0-2.67-.655-3.327-1.432.39-.526.853-1.077 1.25-1.574.62.65 1.54 1.104 2.378 1.104 1.2 0 1.637-.585 1.637-1.155 0-1.127-.925-1.583-2.585-2.09-1.595-.487-2.31-1.32-2.31-2.52 0-2.062 1.638-3.342 4.14-3.342 1.29 0 2.52.548 3.195 1.233.355.51.782 1.096 1.144 1.621z" clip-rule="evenodd" />
                </svg>
            </div>
            <h3>Congratulations!</h3>
            <p>You got <strong>100 free credits</strong> upon joining us. Use them wisely to unlock premium notes.</p>
            <button class="btn-submit" id="btn-modal-continue">Awesome!</button>
        </div>
    </div>

    <script src="../utility/essentials.js"></script>
    <script src="../javascript/signup.js"></script>
</body>
</html>
