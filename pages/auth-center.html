<!DOCTYPE html>
<html lang="en">

<head>
    <script src="../utility/ctrl-guard.js"></script>
    <script src="../javascript/developer-guard.js"></script>
    <script src="../javascript/auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - TexaNotes</title>
    <link rel="stylesheet" href="../stylesheets/auth-center.css">
    <script src="../utility/pwa-register.js"></script>
    <script src="../theme.js"></script> <!-- Added theme script for dark mode flash prevention -->
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo" title="TexaNotes">TexaNotes</div>

        <ul class="nav-links">
            <li><a href="../index.html">Home</a></li>
            <li><a href="./profile.html">Profile</a></li>
            <li><a href="#" id="btn-logout" class="btn-logout">Logout</a></li>
        </ul>

        <!-- Hamburger Icon for Mobile -->
        <div class="hamburger">
            <div class="line1"></div>
            <div class="line2"></div>
            <div class="line3"></div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="dashboard-container">
        <header class="page-header">
            <h1>Control Panel</h1>
            <p>Select a module to manage your application data.</p>
        </header>

        <!-- Options Grid -->
        <div class="options-grid">

            <!-- Users Option -->
            <a href="./user-auth-center.html" class="option-card">
                <div class="icon-wrapper users-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                </div>
                <h2>Users</h2>
                <p>View, search, block, and manage registered accounts.</p>
            </a>

            <!-- Notes Option -->
            <a href="./notes-auth-center.html" class="option-card">
                <div class="icon-wrapper notes-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                </div>
                <h2>Notes</h2>
                <p>Browse, upload, and organize study materials.</p>
            </a>

            <!-- NEW: Verify Payments Option -->
            <a href="./verify-payments.html" class="option-card">
                <div class="icon-wrapper payments-icon">
                    <!-- SVG Shield Check Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                            d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                    </svg>
                </div>
                <h2>Verify Payments</h2>
                <p>Approve or reject user credit purchases.</p>
            </a>

        </div>
    </main>

    <script src="../utility/essentials.js"></script>
    <script src="../javascript/auth-center.js"></script>
</body>

</html>
