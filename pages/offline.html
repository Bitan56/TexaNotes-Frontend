<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../utility/pwa-register.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - TexaNotes</title>
    <meta name="theme-color" content="#4f46e5">
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --success-color: #10b981;
            --bg-color: #f9fafb;
            --text-dark: #1f2937;
            --text-light: #6b7280;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .offline-container {
            background: white;
            padding: 3rem 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            max-width: 400px;
            width: 100%;
            transition: all 0.3s ease;
        }

        .icon-container {
            margin-bottom: 1.5rem;
            color: var(--text-light);
            transition: color 0.3s ease;
        }

        /* SVG styling */
        .icon-container svg {
            width: 80px;
            height: 80px;
            stroke: currentColor;
        }

        h1 {
            color: var(--text-dark);
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        p {
            color: var(--text-light);
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 2rem;
        }

        .btn-retry {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            width: 100%;
        }

        .btn-retry:hover {
            background-color: var(--primary-hover);
        }

        .btn-retry:active {
            transform: scale(0.98);
        }
        
        /* Classes applied via JS when connection is restored */
        .restored .icon-container {
            color: var(--success-color);
        }
        .restored .btn-retry {
            background-color: var(--success-color);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="offline-container" id="status-container">
        <div class="icon-container" id="icon-container">
            <!-- Disconnected Cloud Icon -->
            <svg id="status-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M22.5 13.284c2.146-.43 3.69-2.27 3.69-4.534 0-2.652-2.149-4.8-4.8-4.8-1.74 0-3.266.924-4.133 2.302A6 6 0 005.25 9.75c0 3.125 2.38 5.704 5.42 5.972" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a3 3 0 003-3v-1.5" />
            </svg>
        </div>
        
        <h1 id="status-title">You're Offline</h1>
        <p id="status-text">It looks like you've lost your internet connection. Please check your network and try again.</p>
        
        <button class="btn-retry" id="retry-btn" onclick="window.location.reload()">Try Again</button>
    </div>

    <script>
        // Listen for the exact moment the device connects back to the internet
        window.addEventListener('online', () => {
            
            // 1. Update the UI to show success
            document.getElementById('status-container').classList.add('restored');
            
            // Change the text
            document.getElementById('status-title').textContent = "Connection Restored!";
            document.getElementById('status-text').textContent = "Redirecting you to the main page...";
            document.getElementById('retry-btn').textContent = "Redirecting...";
            
            // Swap to a happy/connected cloud icon
            document.getElementById('icon-container').innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15a4.5 4.5 0 004.5 4.5H18a3.75 3.75 0 001.332-7.257 3 3 0 00-3.758-3.848 5.25 5.25 0 00-10.233 2.33A4.502 4.502 0 002.25 15z" />
                </svg>
            `;

            // 2. Wait 1.5 seconds so the user can read the message, then redirect
            setTimeout(() => {
                // Adjust this path if your main page is located somewhere else (e.g., '../index.html')
                window.location.href = '../index.html'; 
            }, 1500);
        });
    </script>
</body>
</html>
